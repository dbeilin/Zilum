<script>
  // Before first paint, so a chosen theme never flashes the other one.
  try {
    const theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch {}
</script>

        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/></g></svg>

<main>

    <h1>Screenshots for Windows 11</h1>
    <p class="lede">Capture, mark it up, copy.</p>

    <!-- Non-breaking spaces keep each phrase whole, so a narrow phone breaks before "Free". -->
    <p class="release">Version&nbsp;0.1.0&nbsp;· 1.1&nbsp;MB&nbsp;· Free&nbsp;and&nbsp;open&nbsp;source,&nbsp;MIT</p>
  </section>

  <!-- The features: one stage, a tab per feature. Without the script it shows Annotate. -->
  <section class="features">
    <div class="tabs">
      <div class="tab-list" role="tablist" aria-label="Features">
        <button type="button" role="tab" id="tab-capture" aria-controls="panel-capture" aria-selected="false" tabindex="-1">Capture</button>
        <button type="button" role="tab" id="tab-annotate" aria-controls="panel-annotate" aria-selected="true">Annotate</button>
        <button type="button" role="tab" id="tab-blur" aria-controls="panel-blur" aria-selected="false" tabindex="-1">Blur</button>
        <button type="button" role="tab" id="tab-text" aria-controls="panel-text" aria-selected="false" tabindex="-1">Copy text</button>
      </div>
      <!-- The same labels in the selected colours, clipped to the selected tab, so the colour
           changes exactly at the pill's edge as it slides. -->
      <div class="tab-list tab-highlight" aria-hidden="true">
        <span>Capture</span><span>Annotate</span><span>Blur</span><span>Copy text</span>
      </div>
    </div>

    <div class="panels">
      <figure class="panel" role="tabpanel" id="panel-capture" aria-labelledby="tab-capture" inert>
        <div class="stage">
          <img src="assets/overlay-mid-drag.png" width="720" height="490" decoding="async"
               alt="The overlay over the Bloom wallpaper mid-drag: the selection lit, the screen around it dimmed, and 841 × 441 beside the pointer.">
        </div>
        <figcaption>PrintScreen freezes the screen. Drag a region or click a window.</figcaption>
      </figure>
      <figure class="panel" role="tabpanel" id="panel-annotate" aria-labelledby="tab-annotate">
        <div class="stage">
          <img src="assets/hero-editor-arrow.png" width="880" height="495"
               alt="The Zilum editor over a region capture of the Windows 11 Bloom wallpaper, its bar along the top and one red arrow placed.">
        </div>
        <figcaption>Arrows, rectangles, pen, text and numbered badges. Copy or save from the same bar.</figcaption>
      </figure>
      <figure class="panel" role="tabpanel" id="panel-blur" aria-labelledby="tab-blur" inert>
        <div class="stage">
          <img src="assets/editor-arrow-blur-flyout.png" width="880" height="495" decoding="async"
               alt="The editor with a red arrow and a blur placed on a capture of the Bloom, the blur selected and its Level slider open under the bar.">
        </div>
        <figcaption>Blur a region in one drag, and set how coarse it is.</figcaption>
      </figure>
      <figure class="panel" role="tabpanel" id="panel-text" aria-labelledby="tab-text" inert>
        <div class="stage">
          <img src="assets/notice-copied-text.png" width="720" height="310" decoding="async"
               alt="The Notice “Copied text” on the Bloom wallpaper, beside the edge of Zilum's Settings window.">
        </div>
        <figcaption>Copy the text in a region instead of the image, with the OCR built into Windows.</figcaption>
      </figure>
    </div>
  </section>
</main>

<footer>
  <a class="wordmark" href="./">

<script>
  // The feature tabs: arrow keys move between them, and the highlight is clipped to the selected one.
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const highlight = document.querySelector(".tab-highlight");
  const clip = (tab) => {
    const right = tab.parentElement.clientWidth - tab.offsetLeft - tab.offsetWidth;
    highlight.style.clipPath = `inset(${tab.offsetTop}px ${right}px ${tab.offsetTop}px ${tab.offsetLeft}px round 8px)`;
  };
  const select = (index) => {
    tabs.forEach((tab, i) => {
      const selected = i === index;
      tab.setAttribute("aria-selected", selected);
      tab.tabIndex = selected ? 0 : -1;
      document.getElementById(tab.getAttribute("aria-controls")).inert = !selected;
    });
    clip(tabs[index]);
  };
  const current = () => tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
  tabs.forEach((tab, i) => tab.addEventListener("click", () => select(i)));
  tabs[0].parentElement.addEventListener("keydown", (event) => {
    const last = tabs.length - 1;
    const next = { ArrowRight: current() + 1, ArrowLeft: current() - 1, Home: 0, End: last }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    const index = (next + tabs.length) % tabs.length;
    select(index);
    tabs[index].focus();
  });
  // Place the highlight before it may move, and again whenever the labels change width.
  new ResizeObserver(() => clip(tabs[current()])).observe(tabs[0].parentElement);
  requestAnimationFrame(() => highlight.classList.add("ready"));

  // The theme picker: System follows Windows, Light and Dark are remembered.
  const root = document.documentElement;
  const picker = document.querySelector(".theme");
  const show = (theme) => {
    for (const button of picker.children) {
      button.setAttribute("aria-pressed", button.dataset.theme === theme);
    }
  };
  show(root.dataset.theme ?? "system");
  picker.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const theme = button.dataset.theme;
    if (theme === "system") delete root.dataset.theme;
    else root.dataset.theme = theme;
    try {
      if (theme === "system") localStorage.removeItem("theme");
      else localStorage.setItem("theme", theme);
    } catch {}
    show(theme);
  });
</script>
</body>
</html>
