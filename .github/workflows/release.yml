# Publishes when Cargo.toml's version has no release yet, normally the merge
# of a prepare-release PR. Publishing makes the release immutable.
#
# The write token never shares a job with the compiler: build is read-only
# with no cache, and publish runs no third-party code.
name: Release

on:
  push:
    branches: [main]
    paths: ['Cargo.toml']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml's package version '$version' is not X.Y.Z"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is released already"
            new=false
          else
            echo "v$version is new"
            new=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

  build:
    name: Build the exe
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/Zilum.exe
          archive: false
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # tag the commit, publish the release and upload the exe
      pull-requests: read # the merged release PR's description
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Zilum.exe
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Zilum.exe

      # A tag on this commit is a re-run and is kept; one on another commit stops the release.
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2> /dev/null); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v$VERSION already tags $tagged, not $GITHUB_SHA"
              exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" > /dev/null
          fi

      # Match the release PR by merge commit and branch, not the first PR the API lists.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[]
            | select(.merged_at != null
                and .merge_commit_sha == $ENV.GITHUB_SHA
                and .head.ref == "release/v" + $ENV.VERSION
                and .head.repo.full_name == $ENV.GITHUB_REPOSITORY)
            | .body // ""' > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION" dist/Zilum.exe \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Zilum $VERSION" \
            --latest \
            "${notes[@]}"
